<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Подтверждение почты</title>
  <link rel="icon" type="image/png" href="img/mini_logo.png">
  <link rel="stylesheet" href="css/auth.css">
  <style>
    .auth-message { margin: 14px 0; font-size: 15px; line-height: 1.5; }
    .auth-message.error { color: #b42318; }
    .auth-message.success { color: #18723b; }
  </style>
</head>
<body>
  <main class="auth">
    <a class="logo-slot" href="index.html"><img src="img/logo.png" alt="На главную"></a>
    <h1 class="auth__title">подтверждение почты</h1>
    <p class="auth-message" id="callback-message" role="status">Проверяем ссылку подтверждения…</p>
    <p class="auth__note"><a href="login.html">Перейти ко входу</a></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    (async () => {
      const message = document.getElementById('callback-message');
      const setMessage = (text, type) => {
        message.textContent = text;
        message.className = 'auth-message ' + (type || '');
      };

      try {
        const url = new URL(window.location.href);
        const errorDescription = url.searchParams.get('error_description');
        if (errorDescription) throw new Error(decodeURIComponent(errorDescription.replace(/\\+/g, ' ')));

        // Supabase PKCE confirmation returns ?code=...; exchange it for a session.
        const code = url.searchParams.get('code');
        if (code) {
          const { error } = await window.citySupabase.auth.exchangeCodeForSession(code);
          if (error) throw error;
        }

        // Also supports confirmation links using the implicit token hash.
        const { data, error } = await window.citySupabase.auth.getSession();
        if (error) throw error;
        if (!data.session) {
          throw new Error('Ссылка не создала сессию. Возможно, она уже использована или срок её действия истёк.');
        }

        setMessage('Почта успешно подтверждена! Перенаправляем на карту…', 'success');
        setTimeout(() => { window.location.replace('index.html'); }, 1200);
      } catch (error) {
        console.error('Email confirmation callback:', error);
        const raw = String(error && error.message || error || '');
        setMessage(
          raw.includes('expired') || raw.includes('invalid')
            ? 'Ссылка недействительна или устарела. Запросите новое письмо подтверждения.'
            : 'Не удалось подтвердить почту: ' + raw,
          'error'
        );
      }
    })();
  </script>
</body>
</html>
